name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate Flutter Project Directory
        id: locate-flutter
        run: |
          echo "🔍 Searching for pubspec.yaml across repository..."
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -not -path "*/.*/*" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "❌ Error: Could not find pubspec.yaml anywhere in the repository!"
            echo "Repository contents:"
            ls -la
            exit 1
          fi
          FLUTTER_DIR=$(dirname "$PUBSPEC_PATH")
          echo "✅ Found pubspec.yaml at: $PUBSPEC_PATH"
          echo "📁 Flutter project working directory: $FLUTTER_DIR"
          echo "flutter_dir=$FLUTTER_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        working-directory: ${{ steps.locate-flutter.outputs.flutter_dir }}
        run: flutter pub get

      - name: Build APK (Release)
        working-directory: ${{ steps.locate-flutter.outputs.flutter_dir }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            --dart-define=FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
          if-no-files-found: error
