name: patient_monitor
description: "A modern real-time Patient Monitoring Flutter application integrated with Firebase Realtime Database and Google Gemini AI."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_database: ^11.1.4
  google_generative_ai: ^0.4.0
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
